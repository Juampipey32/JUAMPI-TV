plugins { id 'com.android.application' }

android {
    namespace 'com.juampi.tv'
    compileSdk 36
    defaultConfig {
        applicationId 'com.juampi.tv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            def path = System.getenv('JTV_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('JTV_KEYSTORE_PASSWORD')
                keyAlias 'juampi-tv'
                keyPassword System.getenv('JTV_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.3'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.3'
    implementation 'androidx.media3:media3-ui:1.9.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
